<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#f7f7f5">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script>document.documentElement.classList.add('js');</script>
    <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </head>
  <body class="{{ page.body_class | default: 'page' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header" data-site-header>
      <div class="header-inner">
        <a class="identity" href="{{ '/' | relative_url }}" aria-label="Himanshu Shankar, home">
          <span class="identity-mark" aria-hidden="true">HS</span>
          <span class="identity-name">Himanshu Shankar</span>
        </a>
        <div class="header-links">
          <a href="https://www.linkedin.com/in/iamhssingh">LinkedIn</a>
          <a class="button button-small" href="mailto:{{ site.email }}">Contact</a>
        </div>
      </div>
      <nav class="site-nav" aria-label="Portfolio">
        <div class="nav-inner">
          <a href="{{ '/#work' | relative_url }}" data-nav-section="work">Profile</a>
          <a href="{{ '/experience/' | relative_url }}"{% if page.url == '/experience/' %} aria-current="page"{% endif %}>Experience</a>
          <a href="{{ '/consulting/' | relative_url }}"{% if page.url == '/consulting/' %} aria-current="page"{% endif %}>Consulting</a>
          <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>Projects</a>
          <a href="{{ '/himanshushankar/main.pdf' | relative_url }}">Résumé</a>
        </div>
      </nav>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div>
        <p class="footer-title">Himanshu Shankar</p>
        <p>Staff Engineer · Senior Engineering Manager</p>
      </div>
      <div class="footer-links">
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        <a href="https://github.com/{{ site.social.github }}">GitHub</a>
        <a href="https://www.linkedin.com/in/iamhssingh">LinkedIn</a>
        <span>India</span>
      </div>
    </footer>
  </body>
</html>
